<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background with border -->
  <rect x="5" y="5" width="490" height="310" rx="16" fill="url(#certBg)" stroke="url(#borderGrad)" stroke-width="2.5" />
  <rect x="18" y="18" width="464" height="284" rx="10" fill="none" stroke="#334155" stroke-dasharray="6,6" stroke-width="1.5" />
  <!-- Ribbon Badge -->
  <circle cx="250" cy="95" r="42" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-width="2" />
  <polygon points="250,70 258,86 276,88 262,100 266,118 250,109 234,118 238,100 224,88 242,86" fill="#fbbf24" />
  <!-- Text Elements -->
  <text x="250" y="168" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Certificate of Completion</text>
  <text x="250" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Issued to Aryan Pandey</text>
  <!-- Seal / Lines -->
  <line x1="120" y1="230" x2="380" y2="230" stroke="#334155" stroke-width="1" />
  <text x="250" y="258" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Verified Credential</text>
</svg>
