<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="400" height="400" rx="200" fill="url(#avatarGrad)" />
  <rect width="400" height="400" rx="200" fill="url(#innerGlow)" />
  <!-- Profile Silhouette -->
  <g fill="#ffffff" opacity="0.92">
    <!-- Head -->
    <circle cx="200" cy="155" r="75" />
    <!-- Shoulders / Torso -->
    <path d="M90 340 C90 250, 140 230, 200 230 C260 230, 310 250, 310 340 C310 375, 90 375, 90 340 Z" />
  </g>
  <!-- Subtitle badge -->
  <rect x="105" y="342" width="190" height="34" rx="17" fill="#0f172a" fill-opacity="0.85" />
  <text x="200" y="364" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Replace with your photo</text>
</svg>
